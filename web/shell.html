<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
		<style>
/* Launch screen: a key-art poster. The SWAT KATS logo up top, Razor and T-Bone front and
   centre, Dark Kat and Turmoil looming over the Megakat skyline behind them, and a
   comm panel where the cast chatter while the game downloads.
   Art lives in launch/ next to index.html (built by tools/prepare_launch_art.py). */
:root {
	--night: #06070d;
	--sky-top: #0b0a1d;
	--sky-mid: #3b1640;
	--sky-low: #d0482a;
	--yellow: #ffd23f;
	--orange: #ff6a1f;
	--red: #d42a22;
	--hud: #9dffb5;
	--ink: #040407;
	--ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
}

html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #fff; background: var(--night); overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0; overflow: hidden; visibility: hidden; isolation: isolate;
	background: radial-gradient(130% 75% at 50% 100%, var(--sky-low) 0%, var(--sky-mid) 42%, var(--sky-top) 78%, var(--night) 100%);
	font-family: var(--ui);
}
#status-splash { display: none; }

/* Slow cinematic push-in on the whole poster. */
.stage { position: absolute; inset: 0; animation: push 20s ease-out both; }
@keyframes push { from { transform: scale(1.07); } to { transform: scale(1); } }

/* Moon behind the logo, as in the title card. */
.moon {
	position: absolute; left: 50%; top: 7vh; width: 50vh; height: 50vh; transform: translateX(-50%);
	border-radius: 50%; opacity: 0.85;
	background: radial-gradient(circle at 40% 38%, #f3eef9 0%, #cfc4e4 45%, #9d8fc4 75%, rgba(157, 143, 196, 0) 76%);
	box-shadow: 0 0 120px 30px rgba(190, 170, 240, 0.25);
	animation: fadein 2s ease-out both;
}

/* Haze and out-of-focus city lights. */
.haze {
	position: absolute; inset: 0;
	background: radial-gradient(60% 30% at 25% 62%, rgba(255, 120, 80, 0.2), transparent 70%),
		radial-gradient(50% 25% at 78% 58%, rgba(255, 80, 120, 0.16), transparent 70%);
	animation: drift 26s ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translateX(-2%); } to { transform: translateX(2%); } }

/* Villains loom over the city, tinted by the fires below. */
.villain {
	position: absolute; bottom: 14vh; pointer-events: none; animation: loom 2.4s ease-out both;
	filter: drop-shadow(0 0 26px rgba(255, 50, 60, 0.5)); /* on the wrapper so the image mask can't clip it */
}
.villain img { display: block; height: 100%; width: auto; max-width: none; }
.villain.dark-kat { left: 1vw; height: 66vh; --tilt: -2deg; }
.villain.turmoil { right: 0; height: 62vh; --tilt: 2deg; animation-delay: 0.3s; }
.villain img {
	filter: brightness(0.6) saturate(0.85);
	-webkit-mask-image: linear-gradient(to top, transparent 0%, #000 35%);
	mask-image: linear-gradient(to top, transparent 0%, #000 35%);
}
@keyframes loom { from { opacity: 0; transform: translateY(4vh) scale(1.06) rotate(var(--tilt)); } to { opacity: 1; transform: rotate(var(--tilt)); } }

/* Skyline silhouette, in front of the villains and behind the heroes. */
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; }
.skyline svg { width: 100%; height: 100%; display: block; }

/* Razor and T-Bone. */
.heroes {
	position: absolute; left: 50%; bottom: 20vh; height: 68vh; transform: translateX(-50%);
	animation: rise 1.2s cubic-bezier(.2, .8, .2, 1) 0.5s both;
	filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9)) drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6));
}
.heroes::before {
	content: ""; position: absolute; inset: 10% -8% 0; z-index: -1; border-radius: 50%;
	background: radial-gradient(closest-side, rgba(255, 150, 60, 0.55), transparent);
	filter: blur(24px);
}
.heroes img {
	display: block; height: 100%; width: auto; max-width: none;
	-webkit-mask-image: linear-gradient(to top, transparent 0%, #000 22%);
	mask-image: linear-gradient(to top, transparent 0%, #000 22%);
	animation: breathe 6s ease-in-out 1.7s infinite;
}
@keyframes rise { from { transform: translate(-50%, 16vh); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.7vh); } }

/* The SWAT KATS logo across the heroes' legs, as on the title card, with a light sweep. */
.logo {
	position: absolute; left: 50%; bottom: 9vh; width: min(48vw, 70vh * 1.98, 700px); transform: translateX(-50%);
	z-index: 3; animation: slam 0.8s cubic-bezier(.2, 1.5, .4, 1) 1.2s both;
}
.logo img { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.55)) drop-shadow(0 0 34px rgba(255, 90, 40, 0.35)); }
.logo .sheen {
	position: absolute; inset: 0;
	-webkit-mask: url(launch/logo.svg) center / 100% 100% no-repeat; mask: url(launch/logo.svg) center / 100% 100% no-repeat;
	background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.75) 50%, transparent 58%) no-repeat;
	background-size: 260% 100%; animation: sheen 5s ease-in-out 2.4s infinite;
}
@keyframes sheen { from { background-position: 150% 0; } 35%, to { background-position: -60% 0; } }
@keyframes slam { from { transform: translateX(-50%) scale(2.2); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
@keyframes fadein { from { opacity: 0; } }

/* Letterbox bars. */
.bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 4.5vh; background: var(--ink); z-index: 4; }
.bars::before { top: 0; }
.bars::after { bottom: 0; }

/* Comm panel: speaker portrait, radio line, spool gauge. */
.comm {
	position: absolute; left: max(16px, 2vw); bottom: 7vh; z-index: 5;
	width: min(340px, calc(100vw - 32px)); box-sizing: border-box;
	display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center;
	padding: 12px 14px; background: rgba(6, 8, 14, 0.82); border: 2px solid var(--ink);
	box-shadow: 0 0 0 1px rgba(157, 255, 181, 0.25), 0 12px 30px rgba(0, 0, 0, 0.6);
	animation: fadein 0.6s ease-out 1.6s both;
}
.face {
	grid-row: span 2; width: 58px; height: 58px; position: relative; overflow: hidden;
	border: 2px solid var(--hud); box-shadow: 0 0 12px rgba(157, 255, 181, 0.35);
}
.face img { width: 100%; height: 100%; display: block; object-fit: cover; }
.face::after { /* scanlines */
	content: ""; position: absolute; inset: 0;
	background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
}
.quote { min-width: 0; }
.quote .who-name { color: var(--yellow); font-weight: 700; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
.quote .line { font-size: 16px; margin-top: 2px; line-height: 1.3; }
.swap { animation: swap 0.45s ease-out; }
@keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.gauge { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.14); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--orange), var(--yellow)); box-shadow: 0 0 12px var(--orange); transition: width 0.25s; }
.bar.indeterminate i { width: 30%; animation: scan 1.1s ease-in-out infinite alternate; }
@keyframes scan { from { left: 0; } to { left: 70%; } }
.pct { color: var(--hud); font-weight: 700; font-size: 11px; letter-spacing: 0.12em; white-space: nowrap; font-variant-numeric: tabular-nums; }

#status-notice {
	display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
	background: #5b3943; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
	color: #f2e6e6; line-height: 1.4; padding: 1rem 1.4rem; text-align: center;
	width: min(520px, calc(100vw - 32px)); box-sizing: border-box;
}
.fine { position: absolute; bottom: 1.2vh; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255, 255, 255, 0.45); z-index: 5; letter-spacing: 0.05em; }
.missing { display: none !important; }

/* Phones and narrow windows. */
@media (max-aspect-ratio: 1/1) {
	.moon { width: 36vh; height: 36vh; top: 8vh; }
	.heroes { height: 46vh; bottom: 34vh; }
	.logo { width: 92vw; bottom: 22vh; }
	.villain.dark-kat { left: -22vw; height: 36vh; bottom: 40vh; }
	.villain.turmoil { right: -20vw; height: 34vh; bottom: 40vh; }
	.comm { left: 50%; transform: translateX(-50%); bottom: 6vh; }
}

@media (prefers-reduced-motion: reduce) {
	.stage, .moon, .haze, .villain, .heroes, .heroes img, .logo, .logo .sheen, .comm, .swap, .bar.indeterminate i { animation: none !important; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div class="stage">
				<div class="moon"></div>
				<div class="haze"></div>
				<div class="villain dark-kat"><img src="launch/dark_kat.png" alt="Dark Kat"></div>
				<div class="villain turmoil"><img src="launch/turmoil.png" alt="Turmoil"></div>
				<div class="skyline" aria-hidden="true">
					<svg viewBox="0 0 1600 300" preserveAspectRatio="none">
						<defs>
							<pattern id="win" width="12" height="16" patternUnits="userSpaceOnUse">
								<rect width="12" height="16" fill="#0d0913"/>
								<rect x="3" y="4" width="5" height="7" fill="#ffc96b" opacity="0.5"/>
							</pattern>
						</defs>
						<path fill="url(#win)" d="M0 300V170h60v-60h40v-40h30v40h50V150h70V50h20V20h12v30h20v100h60V110h80v-50h40v50h50V140h90V30h16V0h8v30h16v110h70V120h60v-80h70v80h40V160h80V100h50V60h30v40h40v60h80V130h60v30h50V90h70v70h60V140h80v160Z"/>
					</svg>
				</div>
				<div class="heroes"><img src="launch/swat_kats.png" alt="T-Bone and Razor"></div>
				<div class="logo"><img src="launch/logo.svg" alt="SWAT Kats: The Radical Squadron"><div class="sheen"></div></div>
			</div>
			<div class="bars" aria-hidden="true"></div>
			<div class="comm">
				<div class="face"><img id="radio-face" src="launch/face_tbone.png" alt=""></div>
				<div class="quote" aria-live="polite">
					<div class="who-name" id="radio-who">T-Bone</div>
					<div class="line" id="radio-line">Hatch is open. Spinning up the turbines.</div>
				</div>
				<div class="gauge">
					<div class="bar indeterminate" id="bar"><i></i></div>
					<div class="pct" id="pct">SPOOLING UP</div>
				</div>
			</div>
			<div class="fine">Unofficial non-commercial fan game · SWAT Kats and its characters © their owners · T-Bone &amp; Razor art by Feno (fan art)</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Art that fails to load drops out of the composition.
document.querySelectorAll('#status img').forEach((img) => {
	const hide = () => (img.closest('.villain, .heroes, .logo, .face') || img).classList.add('missing');
	if (img.complete && img.naturalWidth === 0) {
		hide();
	}
	img.addEventListener('error', hide);
});

// Radio chatter shown while the game downloads: [speaker, portrait, line].
const RADIO = [
	['T-Bone', 'tbone', 'Hatch is open. Spinning up the turbines.'],
	['Razor', 'razor', 'Missiles loaded. Mega-Missile armed and ready.'],
	['Callie Briggs', 'callie', 'SWAT Kats, Megakat City needs you. Now!'],
	['Dark Kat', 'dark_kat', 'Tonight, Megakat City kneels before me.'],
	['T-Bone', 'tbone', 'Hang on to your tail, buddy!'],
	['Turmoil', 'turmoil', 'My fortress is ready. Let them come.'],
	['Razor', 'razor', 'Radar is hot. Creeplings inbound from the bay.'],
];
// Warm the portrait cache so swaps are instant.
RADIO.forEach((r) => { new Image().src = 'launch/face_' + r[1] + '.png'; });

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const bar = document.getElementById('bar');
	const fill = bar.firstElementChild;
	const pct = document.getElementById('pct');
	const face = document.getElementById('radio-face');
	const quote = face.closest('.comm');
	const who = document.getElementById('radio-who');
	const line = document.getElementById('radio-line');

	let initializing = true;
	let statusMode = '';
	let radioIndex = 0;
	const radioTimer = setInterval(() => {
		radioIndex = (radioIndex + 1) % RADIO.length;
		const [name, portrait, text] = RADIO[radioIndex];
		who.textContent = name;
		line.textContent = text;
		face.src = 'launch/face_' + portrait + '.png';
		[face, who, line].forEach((el) => {
			el.classList.remove('swap');
			void el.offsetWidth; // restart the animation
			el.classList.add('swap');
		});
	}, 3000);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(radioTimer);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((l) => {
			statusNotice.appendChild(document.createTextNode(l));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'This browser is missing features the game needs:\n';
		displayFailureNotice(missingMsg + missing.join('\n') + '\nTry the latest Chrome, Edge or Firefox on a desktop computer.');
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const p = Math.min(100, Math.round((current / total) * 100));
					bar.classList.remove('indeterminate');
					fill.style.width = p + '%';
					pct.textContent = 'SPOOLING TURBINES ' + p + '%';
				} else {
					bar.classList.add('indeterminate');
					pct.textContent = 'SPOOLING UP';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
