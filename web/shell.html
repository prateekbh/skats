<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
		<style>
/* Launch screen: a key-art poster. Razor and T-Bone front and centre, the supporting
   cast behind them, Megakat City burning orange below, the logo on top.
   Character art lives in launch/ next to index.html (see web/launch/README.md);
   any missing image simply drops out of the composition. */
:root {
	--night: #07080f;
	--sky-top: #0d0c22;
	--sky-mid: #3a1840;
	--sky-low: #c2452a;
	--yellow: #ffd23f;
	--orange: #ff6a1f;
	--red: #e3261b;
	--blue: #3552e8;
	--hud: #9dffb5;
	--ink: #040407;
	--display: 'Bungee', Impact, 'Arial Black', sans-serif;
	--ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
}

html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #fff; background: var(--night); overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0; overflow: hidden; visibility: hidden;
	background: radial-gradient(120% 70% at 50% 100%, var(--sky-low) 0%, var(--sky-mid) 45%, var(--sky-top) 80%, var(--night) 100%);
	font-family: var(--ui);
	isolation: isolate;
}
#status-splash { display: none; }

/* Slow cinematic push-in on the whole poster. */
.stage { position: absolute; inset: 0; animation: push 18s ease-out both; }
@keyframes push { from { transform: scale(1.08); } to { transform: scale(1); } }

/* Out-of-focus city lights and drifting haze. */
.bokeh {
	position: absolute; inset: 40% -10% 0; filter: blur(6px); opacity: 0.55;
	background:
		radial-gradient(6px 6px at 8% 70%, #ffd38a, transparent), radial-gradient(5px 5px at 17% 82%, #ffb36b, transparent),
		radial-gradient(7px 7px at 26% 64%, #ffe1a8, transparent), radial-gradient(5px 5px at 38% 88%, #ffc27a, transparent),
		radial-gradient(6px 6px at 52% 74%, #ffd38a, transparent), radial-gradient(8px 8px at 63% 86%, #ff9f5a, transparent),
		radial-gradient(5px 5px at 74% 68%, #ffe1a8, transparent), radial-gradient(7px 7px at 86% 80%, #ffc27a, transparent),
		radial-gradient(6px 6px at 94% 66%, #ffd38a, transparent);
	animation: drift 30s linear infinite alternate;
}
.haze {
	position: absolute; inset: 0;
	background: radial-gradient(60% 30% at 30% 60%, rgba(255, 140, 90, 0.18), transparent 70%),
		radial-gradient(50% 25% at 75% 55%, rgba(255, 90, 120, 0.14), transparent 70%);
	animation: drift 24s ease-in-out infinite alternate-reverse;
}
@keyframes drift { from { transform: translateX(-2%); } to { transform: translateX(2%); } }

/* Skyline silhouette along the bottom. */
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; opacity: 0.95; }
.skyline svg { width: 100%; height: 100%; display: block; }

/* Characters. Each sits in a .who slot with a coloured rim glow behind it. */
.cast { position: absolute; inset: 0; pointer-events: none; }
.who { position: absolute; bottom: 0; display: flex; align-items: flex-end; justify-content: center; }
.who img {
	display: block; height: 100%; width: auto; max-width: none;
	filter: drop-shadow(0 0 18px rgba(0, 0, 0, 0.6));
	/* Stills with a background fade into the scene; cut-outs are unaffected. */
	-webkit-mask-image: linear-gradient(to top, transparent 0%, #000 18%);
	mask-image: linear-gradient(to top, transparent 0%, #000 18%);
}
.who::before {
	content: ""; position: absolute; inset: 15% 5% 0; z-index: -1; border-radius: 50%;
	background: radial-gradient(closest-side, var(--glow, rgba(255, 120, 60, 0.55)), transparent);
	filter: blur(20px);
}
.who.missing { display: none; }

.hero { height: 74vh; animation: rise 1.1s cubic-bezier(.2, .8, .2, 1) both, breathe 6s ease-in-out 1.1s infinite; }
.hero.razor { left: 4vw; --glow: rgba(255, 210, 63, 0.5); animation-delay: 0.25s, 1.35s; }
.hero.tbone { right: 4vw; --glow: rgba(255, 106, 31, 0.55); animation-delay: 0.4s, 1.5s; }
.side { height: 52vh; opacity: 0.85; filter: saturate(0.85) brightness(0.8); animation: rise 1.4s cubic-bezier(.2, .8, .2, 1) both; }
.side.callie { left: 26vw; --glow: rgba(120, 170, 255, 0.45); animation-delay: 0.7s; }
.side.feral { right: 26vw; --glow: rgba(90, 140, 255, 0.4); animation-delay: 0.8s; }
.villain {
	top: 6vh; bottom: auto; height: 40vh; left: 50%; transform: translateX(-50%);
	opacity: 0.55; filter: brightness(0.55) saturate(0.7) hue-rotate(-10deg);
	--glow: rgba(200, 40, 70, 0.55); animation: loom 2s ease-out 0.2s both;
}
.villain img { -webkit-mask-image: radial-gradient(closest-side, #000 60%, transparent); mask-image: radial-gradient(closest-side, #000 60%, transparent); }
@keyframes rise { from { transform: translateY(14vh); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.8vh); } }
@keyframes loom { from { opacity: 0; transform: translateX(-50%) scale(1.15); } to { opacity: 0.55; transform: translateX(-50%) scale(1); } }

/* Logo with a metallic fill and a light sweep. */
.logo { position: absolute; left: 0; right: 0; top: 42vh; text-align: center; z-index: 3; animation: slam 0.8s cubic-bezier(.2, 1.5, .4, 1) 0.9s both; }
.logo h1 {
	position: relative; display: inline-block; margin: 0;
	font-family: var(--display); font-weight: 400; font-size: clamp(52px, 9.5vw, 136px); line-height: 0.9;
	transform: skew(-8deg);
	background: linear-gradient(180deg, #fff6c9 0%, var(--yellow) 42%, #f0a020 58%, #ffd23f 100%);
	-webkit-background-clip: text; background-clip: text; color: transparent;
	-webkit-text-stroke: 2px #5a2400;
	filter: drop-shadow(5px 5px 0 var(--orange)) drop-shadow(5px 5px 0 var(--ink)) drop-shadow(0 0 30px rgba(255, 150, 40, 0.45));
}
.logo h1::after {
	content: "SWAT KATS"; position: absolute; inset: 0; color: transparent;
	background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.85) 50%, transparent 60%) no-repeat;
	background-size: 250% 100%; -webkit-background-clip: text; background-clip: text;
	animation: sheen 4s ease-in-out 2s infinite;
}
@keyframes sheen { from { background-position: 150% 0; } 40%, to { background-position: -60% 0; } }
.logo p {
	margin: 0.5em 0 0; font-weight: 700; letter-spacing: 0.55em; font-size: clamp(13px, 1.9vw, 22px);
	text-shadow: 0 2px 0 var(--ink), 0 0 16px rgba(0, 0, 0, 0.8);
}
@keyframes slam { from { transform: scale(2.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* Letterbox bars for a widescreen feel. */
.bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 5vh; background: var(--ink); z-index: 4; }
.bars::before { top: 0; }
.bars::after { bottom: 0; }

/* Status strip: radio quote and the spool gauge, sitting on the bottom letterbox. */
.strip {
	position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 5;
	width: min(620px, calc(100vw - 32px)); box-sizing: border-box; text-align: center;
}
.quote { min-height: 2.8em; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9); }
.quote .who-name { color: var(--yellow); font-weight: 700; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
.quote .line { font-size: 17px; margin-top: 3px; animation: fadein 0.5s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.gauge { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.14); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--orange), var(--yellow)); box-shadow: 0 0 12px var(--orange); transition: width 0.25s; }
.bar.indeterminate i { width: 30%; animation: scan 1.1s ease-in-out infinite alternate; }
@keyframes scan { from { left: 0; } to { left: 70%; } }
.pct { color: var(--hud); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; min-width: 11em; text-align: right; font-variant-numeric: tabular-nums; }

#status-notice {
	display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
	background: #5b3943; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
	color: #f2e6e6; line-height: 1.4; padding: 1rem 1.4rem; text-align: center;
	width: min(520px, calc(100vw - 32px)); box-sizing: border-box;
}
.fine { position: absolute; bottom: 1.4vh; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255, 255, 255, 0.45); z-index: 5; letter-spacing: 0.05em; }

/* Phones: heroes shrink to the sides of the logo, supporting cast hides. */
@media (max-width: 720px) {
	.hero { height: 46vh; }
	.hero.razor { left: -14vw; }
	.hero.tbone { right: -14vw; }
	.side { display: none; }
	.logo { top: 30vh; }
}

@media (prefers-reduced-motion: reduce) {
	.stage, .bokeh, .haze, .hero, .side, .villain, .logo, .logo h1::after, .bar.indeterminate i { animation: none !important; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div class="stage">
				<div class="haze"></div>
				<div class="bokeh"></div>
				<div class="cast">
					<div class="who villain"><img src="launch/dark_kat.png" alt="Dark Kat"></div>
					<div class="who side callie"><img src="launch/callie.png" alt="Callie Briggs"></div>
					<div class="who side feral"><img src="launch/feral.png" alt="Commander Feral"></div>
				</div>
				<div class="skyline" aria-hidden="true">
					<svg viewBox="0 0 1600 300" preserveAspectRatio="none">
						<defs>
							<pattern id="win" width="12" height="16" patternUnits="userSpaceOnUse">
								<rect width="12" height="16" fill="#0f0a16"/>
								<rect x="3" y="4" width="5" height="7" fill="#ffc96b" opacity="0.55"/>
							</pattern>
						</defs>
						<path fill="url(#win)" d="M0 300V170h60v-60h40v-40h30v40h50V150h70V50h20V20h12v30h20v100h60V110h80v-50h40v50h50V140h90V30h16V0h8v30h16v110h70V120h60v-80h70v80h40V160h80V100h50V60h30v40h40v60h80V130h60v30h50V90h70v70h60V140h80v160Z"/>
					</svg>
				</div>
				<div class="cast">
					<div class="who hero razor"><img src="launch/razor.png" alt="Razor"></div>
					<div class="who hero tbone"><img src="launch/tbone.png" alt="T-Bone"></div>
				</div>
				<div class="logo">
					<h1>SWAT KATS</h1>
					<p>MEGAKAT SKIES</p>
				</div>
			</div>
			<div class="bars" aria-hidden="true"></div>
			<div class="strip">
				<div class="quote" aria-live="polite">
					<div class="who-name" id="radio-who">T-Bone</div>
					<div class="line" id="radio-line">Hatch is open. Spinning up the turbines.</div>
				</div>
				<div class="gauge">
					<div class="bar indeterminate" id="bar"><i></i></div>
					<div class="pct" id="pct">SPOOLING UP</div>
				</div>
			</div>
			<div class="fine">Unofficial non-commercial fan game · SWAT Kats and its characters © their owners</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Character art that fails to load drops out of the composition.
document.querySelectorAll('.who img').forEach((img) => {
	const hide = () => img.parentElement.classList.add('missing');
	if (img.complete && img.naturalWidth === 0) {
		hide();
	}
	img.addEventListener('error', hide);
});

// Radio chatter shown while the game downloads.
const RADIO = [
	['T-Bone', 'Hatch is open. Spinning up the turbines.'],
	['Razor', 'Missiles loaded. Mega-Missile armed and ready.'],
	['Callie Briggs', 'SWAT Kats, Megakat City needs you!'],
	['T-Bone', 'Hang on to your tail, buddy!'],
	['Commander Feral', 'Those vigilantes had better stay out of my airspace.'],
	['Razor', 'Radar is hot. Creeplings inbound from the bay.'],
	['Dark Kat', 'Tonight, Megakat City falls.'],
];

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const bar = document.getElementById('bar');
	const fill = bar.firstElementChild;
	const pct = document.getElementById('pct');
	const who = document.getElementById('radio-who');
	const line = document.getElementById('radio-line');

	let initializing = true;
	let statusMode = '';
	let radioIndex = 0;
	const radioTimer = setInterval(() => {
		radioIndex = (radioIndex + 1) % RADIO.length;
		who.textContent = RADIO[radioIndex][0];
		line.textContent = RADIO[radioIndex][1];
		line.style.animation = 'none';
		void line.offsetWidth; // restart the fade-in
		line.style.animation = '';
	}, 2800);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(radioTimer);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((l) => {
			statusNotice.appendChild(document.createTextNode(l));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'This browser is missing features the game needs:\n';
		displayFailureNotice(missingMsg + missing.join('\n') + '\nTry the latest Chrome, Edge or Firefox on a desktop computer.');
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const p = Math.min(100, Math.round((current / total) * 100));
					bar.classList.remove('indeterminate');
					fill.style.width = p + '%';
					pct.textContent = 'SPOOLING TURBINES ' + p + '%';
				} else {
					bar.classList.add('indeterminate');
					pct.textContent = 'SPOOLING UP';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
