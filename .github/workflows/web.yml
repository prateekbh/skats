# Builds the Web export with headless Godot and publishes it to GitHub Pages.
# Enable Pages in the repo settings with "Source: GitHub Actions" (until then the deploy job waits
# out GitHub's branch deploy so the game, not the README, ends up live).
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j templates.tpz 'templates/web_*' -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # God-mode autopilot plays Episode 1. Exit 0 = mission won, 1 = time limit reached
      # (both fine); anything else (mission failed, crash) fails the build.
      - name: Smoke test (autopilot plays Episode 1 for 60 s)
        run: |
          godot --headless --path . --import
          set +e
          godot --headless --path . -- --autotest --god --seconds=60 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -q "SCRIPT ERROR" smoke.log; then echo "Script errors during smoke test"; exit 1; fi
          [ "$code" -le 1 ]

      - name: Export for Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          # Launch-screen character art is served next to index.html.
          mkdir -p build/web/launch
          cp web/launch/*.png web/launch/*.svg web/launch/*.mp3 build/web/launch/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repo's Pages source is still "Deploy from a branch", GitHub's own
      # "pages build and deployment" run also publishes on every push and puts the README up.
      # Wait for it to finish so the game is always the deploy that lands last.
      - name: Wait for GitHub's branch deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")]')
            total=$(echo "$runs" | jq 'length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo "Branch deploy finished"; break; fi
            # No branch deploy at all after a minute: Pages already uses GitHub Actions.
            if [ "$total" -eq 0 ] && [ "$i" -ge 6 ]; then echo "No branch deploy"; break; fi
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
