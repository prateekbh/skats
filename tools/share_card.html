<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Bangers; src: url("../assets/fonts/Bangers-Regular.ttf"); }
@font-face { font-family: Neue; font-weight: 700; src: url("../assets/fonts/ComicNeue-Bold.ttf"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: Neue, sans-serif;
	background: linear-gradient(180deg, #1d4fb8 0%, #4f93e0 48%, #f7c58a 100%); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(10,20,60,.22) 2px, transparent 2.5px); background-size: 14px 14px;
	-webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); }
.sun { position: absolute; right: 120px; top: 70px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(#fff6d0 30%, rgba(255,235,160,.0) 70%); }
.city { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; }
.panel { position: absolute; border: 7px solid #0c0c14; box-shadow: 9px 10px 0 #0c0c14; overflow: hidden; background: #222; }
.panel img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attack { left: 40px; top: 150px; width: 270px; height: 390px; transform: rotate(-3deg); }
.sfx { position: absolute; left: 12px; top: 20px; font-family: Bangers; font-size: 58px; color: #ffd21f; -webkit-text-stroke: 3px #0c0c14; transform: rotate(-10deg); text-shadow: 4px 4px 0 #0c0c14; }
.jet { position: absolute; left: 290px; top: 300px; width: 560px; transform: rotate(-5deg); filter: drop-shadow(10px 14px 0 rgba(12,12,20,.55)); }
.logo { position: absolute; left: 330px; top: 24px; width: 560px; filter: drop-shadow(5px 6px 0 #0c0c14); }
.tag { position: absolute; right: 44px; top: 280px; font-family: Bangers; font-size: 50px; letter-spacing: 1px; color: #fff; -webkit-text-stroke: 3px #0c0c14;
	text-shadow: 5px 5px 0 #0c0c14; text-align: right; line-height: 1.02; }
.tag b { color: #ffd21f; font-weight: normal; }
.fine { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #0c0c14; color: #e9e9f2; font-size: 17px; line-height: 40px; padding: 0 28px; }
.fine span { color: #ffd21f; }
</style></head><body>
<div class="dots"></div><div class="sun"></div>
<svg class="city" id="city" viewBox="0 0 1200 250" preserveAspectRatio="none"></svg>
<img class="logo" src="../web/launch/logo.svg">
<div class="panel attack"><img src="../web/launch/city_attack.png"><div class="sfx">KA-BLAM!</div></div>
<img class="jet" src="../web/launch/turbokat_hero.png">
<div class="tag">FLY THE <b>TURBOKAT</b><br>PLAY FREE<br>IN YOUR BROWSER</div>
<div class="fine">Unofficial, non-commercial fan game · Art, characters and music from <span>swatkats.info</span> and the SWAT Kats show, © Hanna-Barbera / Warner Bros. Discovery</div>
<script>
// A dusky skyline of towers along the bottom (seeded so the card is reproducible).
let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
let x = -20, out = '';
while (x < 1220) { const w = 40 + r() * 70, h = 60 + r() * 170;
	const shade = 28 + Math.floor(r() * 22);
	out += `<rect x="${x}" y="${250 - h}" width="${w}" height="${h}" fill="rgb(${shade},${shade + 8},${shade + 40})"/>`;
	for (let wy = 250 - h + 12; wy < 240; wy += 16) for (let wx = x + 7; wx < x + w - 8; wx += 12)
		if (r() > 0.62) out += `<rect x="${wx}" y="${wy}" width="5" height="7" fill="#ffd98a" opacity=".85"/>`;
	x += w + 4 + r() * 8; }
document.getElementById('city').innerHTML = out;
</script></body></html>
